name: 서울 청약 공고 수집
on:
  schedule:
    - cron: '0 22 * * *' # 매일 07:00 KST. GitHub 사정으로 조금 늦을 수 있다
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect/**', '.github/workflows/**'] # 수집 코드를 고치면 바로 시험한다. data/ 커밋으로는 돌지 않는다
permissions:
  contents: write
  issues: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 공고 수집
        id: collect
        run: node collect/ci.mjs
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "seoul-cheongyak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "공고 갱신 $(TZ=Asia/Seoul date +%F)" && git push; fi
      - name: 새 추천 공고 알림
        if: steps.collect.outputs.alert_title != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: ${{ steps.collect.outputs.alert_title }}
          ALERT_BODY: ${{ steps.collect.outputs.alert_body }}
        run: gh issue create --title "$ALERT_TITLE" --body-file "$ALERT_BODY"
